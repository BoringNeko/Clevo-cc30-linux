[workspace]
resolver = "2"
members = ["crates/clevo-proto", "crates/clevo-transport", "crates/clevo-cc-cli", "crates/clevod"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BoringNeko/Clevo-cc30-linux"

[workspace.dependencies]
clevo-proto = { path = "crates/clevo-proto" }
clevo-transport = { path = "crates/clevo-transport" }
clevo-cc-cli = { path = "crates/clevo-cc-cli" }
clevod = { path = "crates/clevod" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

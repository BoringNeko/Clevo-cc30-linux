PACKAGE_NAME="clevo-cc"
PACKAGE_VERSION="@VERSION@"

# Out-of-tree ACPI platform driver for the Clevo DCHU fan controller.
#
# DKMS copies the sources to /usr/src/clevo-cc-@VERSION@ and builds them there.
#
# MAKE[0] is required, not optional: DKMS otherwise runs the kernel build system
# directly, which bypasses this module's Makefile and therefore its LLVM
# auto-detection. On a Clang+ThinLTO kernel (CachyOS and friends) that builds
# the module with GCC and fails to link it against the kernel.
#
# The default below goes through the module Makefile, which reads
# CONFIG_CC_IS_CLANG from the target kernel and adds LLVM=1 when needed. Force a
# toolchain with `MAKE[0]="make LLVM=1"` or `MAKE[0]="make LLVM="`.
MAKE[0]="make KERNELRELEASE=${kernelver}"

BUILT_MODULE_NAME[0]="clevo-cc"
DEST_MODULE_LOCATION[0]="/extra"

# The module is only useful once the EC is up; do not pull it into initramfs.
# Loading is left to the installer / udev / the systemd unit, not to dkms
# (a POST_ADD command would trigger a spurious "script is not executable"
# warning on some dkms versions).
AUTOINSTALL="no"

PACKAGE_NAME="clevo-cc"
PACKAGE_VERSION="@VERSION@"

# Out-of-tree ACPI platform driver for the Clevo DCHU fan controller.
#
# DKMS copies the sources to /usr/src/clevo-cc-@VERSION@ and runs the kernel
# build there. The Makefile detects a Clang-built kernel by itself, so no
# LLVM=1 has to be passed here; override with `make LLVM=1` if detection fails.

BUILT_MODULE_NAME[0]="clevo-cc"
DEST_MODULE_LOCATION[0]="/extra"

# The module is only useful once the EC is up; do not pull it into initramfs.
# Loading is left to the installer / udev / the systemd unit, not to dkms
# (a POST_ADD command would trigger a spurious "script is not executable"
# warning on some dkms versions).
AUTOINSTALL="no"

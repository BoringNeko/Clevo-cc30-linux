[package]
name = "clevo-cc-ui"
version = "0.1.3"
description = "Clevo control-center desktop UI backend (commands over D-Bus; Tauri or headless HTTP for the Electron shell)"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

# This crate is intentionally its own workspace: the root Cargo.toml is a
# dependency-light, hardware-focused workspace and should not pull in Tauri.
[workspace]

[features]
# The Tauri window/tray shell. Turned off for the Electron build, where this
# crate is only the headless backend the Electron main process spawns
# (`--serve`), so the whole Tauri/GTK/Wry stack is dropped.
default = ["tauri-shell"]
tauri-shell = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }

[dev-dependencies]
# Reuse the real daemon for an end-to-end test on a private session bus.
clevod = { path = "../../crates/clevod" }
clevo-transport = { path = "../../crates/clevo-transport" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures-util = "0.3"

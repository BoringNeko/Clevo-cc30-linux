<?xml version="1.0" encoding="UTF-8"?> <!--
  D-Bus policy for org.clevo.CC.

  The D-Bus policy only controls who may *send* a message. Authorization for the
  privileged write methods is decided by the daemon through PolicyKit, because
  PolicyKit (not the bus) is what can prompt the user and remember the result.
  If the bus denied writes outright, a normal user could never reach the
  PolicyKit check and the authentication dialog would never appear.

  So: allow all local users to call the interface; `SetFanMode` / `SetPerfMode`
  then pass through the daemon's PolicyKit gate. Reads are always allowed.
-->
<busconfig>
  <policy user="root">
    <allow own="org.clevo.CC"/>
    <allow send_destination="org.clevo.CC"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.clevo.CC"/>
    <allow receive_sender="org.clevo.CC"/>
  </policy>
</busconfig>

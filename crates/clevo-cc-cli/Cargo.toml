[package]
name = "clevo-cc-cli"
description = "Scriptable CLI for the Clevo control center (read-only by default)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "clevo-cc"
path = "src/main.rs"

[dependencies]
clevo-proto = { workspace = true, features = ["serde"] }
clevo-transport.workspace = true
clevod.workspace = true
clap = { version = "4", features = ["derive"] }
zbus.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
clevo-proto.workspace = true
clevo-transport.workspace = true
tokio.workspace = true
zbus.workspace = true

[lints]
workspace = true

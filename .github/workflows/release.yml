name: Release

# Build deb / rpm / AppImage packages and attach them to a GitHub Release when
# a version tag is pushed (e.g. v0.2.2). Can also be run manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  packages:
    name: Build packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Packaging tools: dpkg-deb, rpmbuild.
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev

      # Tauri / UI build dependencies (WebKitGTK 4.1, GTK3, libsoup3).
      - name: Install UI build dependencies
        run: |
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev patchelf libudev-dev pkg-config

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build the UI
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm tauri build --no-bundle

      - name: Fetch appimagetool
        run: |
          mkdir -p packaging/appimage
          curl -fsSL -o packaging/appimage/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x packaging/appimage/appimagetool-x86_64.AppImage

      - name: Build deb, rpm and AppImage
        run: packaging/build-packages.sh all

      # The Electron AppImage is separate: it needs electron-builder, which
      # downloads the Electron runtime (~120 MB). Kept out of `all` so the Tauri
      # path stays fast, but part of the release because the notes advertise it.
      - name: Build the Electron AppImage
        run: packaging/build-packages.sh electron

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    needs: packages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          body: |
            > **构建包未经完整验收，不保证所有机型可用。** 仅作方便尝试，请自行评估风险。
            > AppImage **仅包含 UI 界面**（不含守护进程与内核驱动）。

            ### Fix
            - 修复 AppSettings 通道不可用时能力信息缺失的问题
            - 通过 GCMD 补齐 capabilities 和 profile list 数据。

            ### Add
            - 添加电源与电池页面
            - 添加切换电源模式和查看电池状态
            - 添加设置充电阈值
            - 添加 UI 登录自启动
            - 完善只读 doctor 诊断
          fail_on_unmatched_files: true

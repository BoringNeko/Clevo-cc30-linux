name: Release

# Build deb / rpm / AppImage packages and attach them to a GitHub Release when
# a version tag is pushed (e.g. v0.1.1). Can also be run manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  packages:
    name: Build packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Packaging tools: dpkg-deb, rpmbuild.
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev

      # Tauri / UI build dependencies (WebKitGTK 4.1, GTK3, libsoup3).
      - name: Install UI build dependencies
        run: |
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev patchelf pkg-config

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build the UI
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm tauri build --no-bundle

      - name: Fetch appimagetool
        run: |
          mkdir -p packaging/appimage
          curl -fsSL -o packaging/appimage/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x packaging/appimage/appimagetool-x86_64.AppImage

      - name: Build deb, rpm and AppImage
        run: packaging/build-packages.sh all

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    needs: packages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          body: |
            > ⚠️ **构建包未经测试，不保证可用。** 仅作方便尝试，请自行评估风险。
            > AppImage **仅包含 UI 界面**（不含守护进程与内核驱动）。

            ### fix
            - 修复 NVIDIA 驱动下无法启动 / 无法硬件加速（WebKitGTK GBM 崩溃）
            - 修复自定义强调色未应用到按钮、曲线、仪表等
            - 修复窗口分辨率不记忆，重启即还原

            ### add
            - 自绘标题栏（最小化 / 全屏 / 关闭）
            - 自定义取色弹窗（替代原生取色器）
            - 新增「显示」设置（窗口比例、分辨率、缩放）
            - 系统托盘（快速切换性能模式、打开控制中心、退出）

            ### del
            - 移除部分杂项文本
          fail_on_unmatched_files: true

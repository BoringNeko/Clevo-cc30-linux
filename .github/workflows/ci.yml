name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests (no hardware required)
        run: cargo test --workspace

      - name: D-Bus integration test (private session bus)
        run: dbus-run-session -- cargo test --workspace

  ui:
    name: Tauri UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 system dependencies for Ubuntu.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev patchelf dbus-x11

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: ui
        run: pnpm typecheck

      - name: Frontend tests
        working-directory: ui
        run: pnpm test

      - name: Frontend build
        working-directory: ui
        run: pnpm build

      - name: Rust backend tests (incl. D-Bus integration)
        working-directory: ui/src-tauri
        run: dbus-run-session -- cargo test

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n packaging/install.sh
          bash -n packaging/uninstall.sh
          bash -n packaging/build-packages.sh

      - name: Installer / uninstaller dry-run
        run: |
          packaging/install.sh --dry-run
          packaging/uninstall.sh --dry-run

      - name: XML well-formedness (dbus + polkit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          xmllint --noout packaging/dbus/org.clevo.CC.conf
          xmllint --noout packaging/polkit/org.clevo.CC.policy

      - name: systemd unit
        run: sudo systemd-analyze verify packaging/systemd/clevod.service || true

      - name: udev rule
        run: sudo udevadm verify packaging/udev/99-clevo-cc.rules

      - name: ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck packaging/install.sh packaging/uninstall.sh packaging/build-packages.sh
